[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-anthropic",
    "pypdf",
    "sqlglot",
    "rapidfuzz",
    "python-dotenv",
    "pyyaml",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
emporio = "emporio.cli:main"
emporio-eval = "emporio.evaluation.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["emporio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
